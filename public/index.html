<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>優惠資訊即時通知</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<style>
:root{--a:#ffcc00;--bg:#111;--card:#1c1c1c;--fg:#fff;--mut:#aaa}
@media (prefers-color-scheme:light){:root{--bg:#f6f6f6;--card:#fff;--fg:#111;--mut:#666}}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);padding:20px;padding-bottom:60px}
.c{max-width:420px;margin:0 auto}
h1{font-size:26px;margin:10px 0 4px;text-align:center}
.tag{color:var(--mut);margin:0 0 16px;text-align:center}
button{width:100%;padding:16px;margin:8px 0;font-size:18px;border:0;border-radius:12px;background:var(--a);color:#000;font-weight:700}
#unsub{background:transparent;color:var(--mut);font-size:14px;padding:10px;font-weight:400}
#msg{margin-top:12px;font-size:15px;line-height:1.6;color:var(--mut);white-space:pre-line;text-align:center}
.box{background:var(--card);border-radius:12px;padding:14px;text-align:left;font-size:15px;line-height:1.8;margin-top:12px}
.box b{color:var(--a)}
.ok{color:#2ecc71;font-size:18px;margin:10px 0;text-align:center;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{padding:8px 14px;border-radius:20px;background:var(--card);color:var(--fg);font-size:14px;border:1px solid #444;width:auto;margin:0;font-weight:400}
.chip.on{background:var(--a);color:#000;border-color:var(--a);font-weight:700}
h3{margin:26px 0 6px;font-size:17px}
.deal{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:10px;margin:8px 0;text-decoration:none;color:var(--fg);align-items:center}
.deal img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none}
.deal .ph{width:64px;height:64px;border-radius:8px;background:#333;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.deal .t{font-weight:600;line-height:1.35}
.deal .m{color:var(--mut);font-size:12px;margin-top:3px}
.deal.exp{opacity:.5}
.lineBtn{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:12px;background:#06c755;color:#fff;font-weight:700;text-decoration:none}
</style></head><body><div class="c">
<h1 id="name">🔔 優惠資訊即時通知</h1>
<p class="tag" id="tag">最新優惠、限時活動，第一時間通知你。</p>
<div id="topicBox" hidden>
  <div style="font-size:14px;color:var(--mut)">想收哪些優惠？（不選＝全部）</div>
  <div class="chips" id="chips"></div>
</div>
<button id="install" hidden>安裝到桌面</button>
<button id="sub" hidden>開啟優惠通知</button>
<div id="ok" class="ok" hidden>✅ 優惠通知已開啟</div>
<button id="test" hidden>發送測試通知</button>
<div id="sysnote" class="box" hidden>📱 <b>收不到通知？</b><br>網頁無法偵測手機系統層級的通知開關。請先按上方「發送測試通知」，如果<b>沒有跳出</b>，請到：<br>手機「設定 → 通知與狀態列 → 應用程式通知」，找到 <b>Chrome</b>（若已安裝到桌面，也要檢查本 App）→ 開啟「<b>允許通知</b>」。</div>
<div id="guide"></div>
<div id="msg"></div>
<button id="unsub" hidden>關閉優惠通知</button>
<a id="lineBtn" class="lineBtn" hidden target="_blank" rel="noopener">加入 LINE 官方帳號</a>
<h3>🎁 最新優惠</h3>
<div id="deals" style="color:var(--mut)">載入中…</div>
</div>
<script>
const VAPID='BM28jEtri0zOpJy0fm44NMh3brS-RKk6NBB1XET8rkNFofI74u9U4qMPFmevaUztuDoMJhsvEFmOIucbM4_5mlY', SB='https://bfydeckhzazenebgduwy.supabase.co', KEY='sb_publishable_fwuVUnvOmOFSCgnv8F-Rhg_OlG9vtlD';
const $=id=>document.getElementById(id);
const msg=t=>$('msg').textContent=t;
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isAndroid=/android/i.test(navigator.userAgent);
const inApp=/line|fban|fbav|instagram|micromessenger/i.test(navigator.userAgent);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const u8=b=>{const p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
const rpc=(fn,a)=>fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(a||{})});
const guide=h=>$('guide').innerHTML=h?'<div class="box">'+h+'</div>':'';

// ===== 品牌設定 + 分類 =====
const getTopics=()=>{try{return JSON.parse(localStorage.getItem('topics')||'[]')}catch(_){return[]}};
async function loadSettings(){
  try{
    const s=await (await rpc('push_demo_settings_get')).json();
    if(s.accent&&/^#[0-9a-f]{6}$/i.test(s.accent))document.documentElement.style.setProperty('--a',s.accent);
    if(s.brand_name){$('name').textContent='🔔 '+s.brand_name;document.title=s.brand_name}
    if(s.tagline)$('tag').textContent=s.tagline;
    if(/^https:\/\//.test(s.line_url||'')){$('lineBtn').href=s.line_url;$('lineBtn').hidden=false}
    const cats=Array.isArray(s.categories)?s.categories:[];
    if(cats.length){
      $('topicBox').hidden=false;
      const on=getTopics();
      $('chips').innerHTML=cats.map(c=>'<button class="chip'+(on.includes(c)?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('');
    }
  }catch(_){}
}
$('chips').onclick=async e=>{
  const b=e.target.closest('.chip');if(!b)return;
  const c=b.dataset.c;let on=getTopics();
  on=on.includes(c)?on.filter(x=>x!==c):[...on,c];
  localStorage.setItem('topics',JSON.stringify(on));
  b.classList.toggle('on');
  // 已訂閱就同步分類到資料庫
  try{const reg=await navigator.serviceWorker.ready;const s=await reg.pushManager.getSubscription();
    if(s&&localStorage.getItem('optout')!=='1')await rpc('push_demo_set_topics',{p_endpoint:s.endpoint,p_topics:on})}catch(_){}
};

// ===== 最新優惠列表 =====
async function loadDeals(){
  try{
    const list=await (await rpc('push_demo_public_list',{p_limit:10})).json();
    $('deals').innerHTML=list.length?list.map(d=>
      '<a class="deal'+(d.expired?' exp':'')+'" href="/article.html?id='+d.id+'">'
      +(d.image_url?'<img src="'+esc(d.image_url)+'" alt="" loading="lazy">':'<div class="ph">🎁</div>')
      +'<div><div class="t">'+esc(d.title)+'</div><div class="m">'
      +(d.category?esc(d.category)+' ・ ':'')+new Date(d.created_at).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})
      +(d.expired?' ・ 已結束':(d.expires_at?' ・ 至 '+new Date(d.expires_at).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}):''))
      +'</div></div></a>').join(''):'目前沒有優惠，敬請期待！';
  }catch(_){$('deals').textContent='載入失敗，請稍後再試'}
}

// ===== 安裝 / 訂閱 =====
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').hidden=false});
$('install').onclick=async()=>{if(dp){dp.prompt();dp=null;$('install').hidden=true}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');

async function subscribe(reg){
  const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
  const r=await rpc('push_demo_subscribe',{p_sub:s.toJSON(),p_topics:getTopics()});
  if(!r.ok)throw new Error(await r.text());
  return s;
}

// 依目前狀態決定畫面；已允許但沒訂閱時自動補訂閱
async function refresh(){
  $('sub').hidden=$('unsub').hidden=$('ok').hidden=$('test').hidden=$('sysnote').hidden=true; guide(''); msg('');
  if(inApp){guide('請改用瀏覽器開啟：<br>點右上角「⋯」→「<b>用瀏覽器開啟</b>」'+(isIOS?'（iPhone 請選 <b>Safari</b>）':'（Android 請選 <b>Chrome</b>）'));return}
  if(isIOS&&!standalone){guide('<b>iPhone 請先安裝到主畫面：</b><br>1. 用 <b>Safari</b> 開啟本頁<br>2. 點下方「<b>分享</b>」按鈕<br>3. 選「<b>加入主畫面</b>」<br>4. 回到主畫面，<b>點圖示開啟</b>後再開啟通知');return}
  if(!('PushManager'in window)||!('Notification'in window)){msg('此瀏覽器不支援推播，請改用 Chrome 或 Safari');return}
  if(Notification.permission==='denied'){
    guide('<b>通知目前被封鎖，請到設定重新開啟：</b><br>'+(isIOS?'設定 → 通知 → 找到本 App → 允許通知':'Chrome 網址列左側 🔒 → 權限 → 通知 → 允許（或 手機設定 → 應用程式 → 通知）')+'<br>開啟後回到本頁即可。');return}
  const reg=await navigator.serviceWorker.ready;
  let s=await reg.pushManager.getSubscription();
  const optout=localStorage.getItem('optout')==='1';
  if(!s&&Notification.permission==='granted'&&!optout){try{s=await subscribe(reg)}catch(e){msg('失敗：'+e.message)}}
  if(s){
    if(!optout)rpc('push_demo_subscribe',{p_sub:s.toJSON(),p_topics:getTopics()});
    $('ok').hidden=false;$('unsub').hidden=false;$('test').hidden=false;$('sysnote').hidden=false;
  }else{$('sub').hidden=false}
}
$('sub').onclick=async()=>{
  try{
    const p=await Notification.requestPermission();
    if(p!=='granted'){await refresh();return msg('未允許通知，請重新點一次並選「允許」')}
    localStorage.removeItem('optout');
    await subscribe(await navigator.serviceWorker.ready);
    await refresh();
  }catch(e){msg('失敗：'+e.message)}
};
$('unsub').onclick=async()=>{
  try{
    const reg=await navigator.serviceWorker.ready;
    const s=await reg.pushManager.getSubscription();
    if(s){await rpc('push_demo_unsubscribe',{p_endpoint:s.endpoint});await s.unsubscribe()}
    localStorage.setItem('optout','1');
    await refresh();msg('🔕 已關閉優惠通知');
  }catch(e){msg('失敗：'+e.message)}
};
// 本機測試通知：確認手機系統層級是否有顯示通知
$('test').onclick=async()=>{
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('測試通知',{body:'如果你看到這則通知，代表手機可以正常顯示優惠通知 ✅',icon:'/icon-192.png',badge:'/icon-192.png',data:{url:'/'}});
    msg('已送出測試通知。若沒有看到，請依上方說明檢查手機通知設定。');
  }catch(e){msg('失敗：'+e.message)}
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();loadDeals()}});
loadSettings();loadDeals();refresh();
if(isAndroid&&!standalone&&!inApp)setTimeout(()=>{if($('install').hidden&&!$('msg').textContent&&!$('guide').innerHTML)msg('Android：請用 Chrome 開啟，點右上角「⋮」→「安裝應用程式」或「加到主畫面」。')},3000);
</script></body></html>
