<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>優惠資訊即時通知</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.c{max-width:360px;width:100%;text-align:center}
button{width:100%;padding:16px;margin:8px 0;font-size:18px;border:0;border-radius:12px;background:#fc0;color:#000;font-weight:700}
button:disabled{opacity:.4}
#msg{margin-top:12px;font-size:15px;line-height:1.6;color:#ccc;white-space:pre-line}
</style></head><body><div class="c">
<h1>🔔 優惠資訊即時通知</h1>
<p style="color:#aaa;margin:0 0 16px">最新優惠、限時活動，第一時間通知你。</p>
<button id="install" hidden>安裝到桌面</button>
<button id="sub">開啟優惠通知</button>
<button id="unsub" hidden style="background:#444;color:#fff">關閉優惠通知</button>
<div id="msg"></div>
</div>
<script>
const VAPID='BM28jEtri0zOpJy0fm44NMh3brS-RKk6NBB1XET8rkNFofI74u9U4qMPFmevaUztuDoMJhsvEFmOIucbM4_5mlY', SB='https://bfydeckhzazenebgduwy.supabase.co', KEY='sb_publishable_fwuVUnvOmOFSCgnv8F-Rhg_OlG9vtlD';
const msg=t=>document.getElementById('msg').textContent=t;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const u8=b=>{const p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;install.hidden=false});
install.onclick=async()=>{if(dp){dp.prompt();dp=null;install.hidden=true}};
if(isIOS&&!standalone)msg('iPhone: tap Share in Safari → "Add to Home Screen", then open the app from your home screen to enable notifications.');
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
const rpc=(fn,a)=>fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});
// Toggle buttons by subscription state
async function refresh(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const s=await reg.pushManager.getSubscription();
    sub.hidden=!!s; unsub.hidden=!s;
    if(s)msg('✅ 優惠通知已開啟');
  }catch(_){}
}
sub.onclick=async()=>{
  try{
    if(!('PushManager'in window))return msg('Push is not supported in this browser'+(isIOS?'\nAdd to Home Screen first, then try again':''));
    const p=await Notification.requestPermission();
    if(p!=='granted')return msg('未允許通知');
    const reg=await navigator.serviceWorker.ready;
    const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
    const r=await rpc('push_demo_subscribe',{p_sub:s.toJSON()});
    if(!r.ok)throw new Error(await r.text());
    msg('✅ 已開啟，之後會即時收到優惠通知'); refresh();
  }catch(e){msg('失敗：'+e.message)}
};
unsub.onclick=async()=>{
  try{
    const reg=await navigator.serviceWorker.ready;
    const s=await reg.pushManager.getSubscription();
    if(s){
      await rpc('push_demo_unsubscribe',{p_endpoint:s.endpoint}); // remove from database first
      await s.unsubscribe(); // then unsubscribe in browser
    }
    msg('🔕 已關閉優惠通知'); sub.hidden=false; unsub.hidden=true;
  }catch(e){msg('失敗：'+e.message)}
};
refresh();
</script></body></html>
