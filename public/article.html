<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>優惠內容</title>
<style>
:root{--a:#ffcc00;--bg:#111;--card:#1c1c1c;--fg:#fff;--mut:#888}
@media (prefers-color-scheme:light){:root{--bg:#f6f6f6;--card:#fff;--fg:#111;--mut:#666}}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}
.c{max-width:560px;margin:auto;padding:20px}
img.hero{width:100%;border-radius:12px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px}
.d{color:var(--mut);font-size:13px;margin-bottom:12px}
.badge{display:inline-block;background:var(--a);color:#000;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-right:6px}
.cd{background:var(--card);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:600}
.b{white-space:pre-line;line-height:1.7;font-size:17px;margin-top:12px}
.btn{display:block;text-align:center;margin-top:12px;padding:15px;border-radius:12px;background:var(--a);color:#000;font-weight:700;text-decoration:none;font-size:17px;border:0;width:100%;box-sizing:border-box}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid #444}
.btn.line{background:#06c755;color:#fff}
.row{display:flex;gap:10px}.row .btn{flex:1}
a.home{display:block;text-align:center;margin-top:18px;color:var(--mut);font-size:14px}
.msg{text-align:center;padding:60px 10px;color:var(--mut);font-size:18px}
</style></head><body><div class="c" id="app">載入中…</div>
<script>
const SB='https://bfydeckhzazenebgduwy.supabase.co',KEY='sb_publishable_fwuVUnvOmOFSCgnv8F-Rhg_OlG9vtlD';
const rpc=(fn,a)=>fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(a||{})});
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=u=>/^https:\/\//i.test(u||'')?u:'';
const app=document.getElementById('app');
const home='<a class="home" href="/">← 回到最新優惠</a>';
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!/^\d+$/.test(id||''))return app.innerHTML='<div class="msg">找不到這則優惠</div>'+home;
  const [ar,sr]=await Promise.all([rpc('push_demo_get',{p_id:+id}),rpc('push_demo_settings_get')]);
  const a=ar.ok?await ar.json():null, s=sr.ok?await sr.json():{};
  if(s.accent&&/^#[0-9a-f]{6}$/i.test(s.accent))document.documentElement.style.setProperty('--a',s.accent);
  if(!a)return app.innerHTML='<div class="msg">找不到這則優惠</div>'+home;
  if(a.status==='unpublished')return app.innerHTML='<div class="msg">🚫 這則優惠已下架</div>'+home;
  document.title=a.title+(s.brand_name?' - '+s.brand_name:'');
  // 每支手機每篇只計一次閱讀
  if(!localStorage.getItem('v'+id)){localStorage.setItem('v'+id,'1');rpc('push_demo_view',{p_id:+id})}
  const expired=a.status==='expired';
  const exp=a.expires_at?new Date(a.expires_at):null;
  const phone=(s.phone||'').replace(/[^\d+]/g,'');
  const addr=s.address||'';
  const shareText=a.title+'\n'+location.href;
  app.innerHTML=(safe(a.image_url)?'<img class="hero" src="'+esc(safe(a.image_url))+'" alt="">':'')
   +(a.category?'<span class="badge">'+esc(a.category)+'</span>':'')+(expired?'<span class="badge" style="background:#888;color:#fff">已結束</span>':'')
   +'<h1>'+esc(a.title)+'</h1>'
   +'<div class="d">'+new Date(a.created_at).toLocaleString('zh-TW')+' ・ 👁 '+(a.views||0)+' 人看過</div>'
   +(exp&&!expired?'<div class="cd" id="cd"></div>':'')
   +(expired?'<div class="cd">這項優惠已結束</div>':'')
   +'<div class="b">'+esc(a.body)+'</div>'
   +(safe(a.link_url)&&!expired?'<a class="btn" href="'+esc(safe(a.link_url))+'" target="_blank" rel="noopener">前往優惠連結</a>':'')
   +((phone||addr)?'<div class="row">'+(phone?'<a class="btn alt" href="tel:'+esc(phone)+'">📞 撥打電話</a>':'')+(addr?'<a class="btn alt" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr)+'" target="_blank" rel="noopener">📍 導航前往</a>':'')+'</div>':'')
   +'<a class="btn line" href="https://line.me/R/msg/text/?'+encodeURIComponent(shareText)+'" target="_blank" rel="noopener">分享到 LINE</a>'
   +(navigator.share?'<button class="btn alt" id="sh">分享給朋友</button>':'')
   +home;
  if(navigator.share)document.getElementById('sh').onclick=()=>navigator.share({title:a.title,text:a.title,url:location.href}).catch(()=>{});
  // 倒數計時
  const cd=document.getElementById('cd');
  if(cd){const tick=()=>{const ms=exp-Date.now();if(ms<=0){cd.textContent='這項優惠已結束';return}
    const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),sec=Math.floor(ms%6e4/1e3);
    cd.textContent='⏳ 距離結束還有 '+(d?d+' 天 ':'')+h+' 小時 '+m+' 分 '+(d?'':sec+' 秒');};
    tick();setInterval(tick,1000)}
})();
</script></body></html>
